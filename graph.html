<!DOCTYPE html>
<html>

<head>
    <title>Analytics</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <div class="navbar">
        <a href="logrun.html">Log Run</a>
        <a href="history.html">History</a>
        <a href="shoe.html">Shoes</a>
        <a href="graph.html" class="active">Analytics</a>
    </div>

    <h1>📈 Analytics</h1>

    <p class="subtitle">
        Progress Tracking
    </p>

    <canvas id="distanceChart"></canvas>

    <br><br>

    <canvas id="paceChart"></canvas>

    <br><br>

    <canvas id="mileageChart"></canvas>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby_lVG_c0re8dsFtHyY3gPE1Sw9wxQ4905V7Sc3q-sGE8iDs5KJfm3qUZuvFZiEeS3B/exec";

fetch(API_URL)
.then(response => response.json())
.then(data => {

    data.sort((a,b) =>
        new Date(a.Date || a.date) -
        new Date(b.Date || b.date)
    );

    const labels = [];
    const distances = [];
    const paces = [];
    const cumulativeMiles = [];

    let totalMiles = 0;

    data.forEach((run, index) => {

        const distance =
            Number(run.Distance || run.distance || 0);

        totalMiles += distance;

        labels.push(`Run ${index + 1}`);

        distances.push(distance);

        cumulativeMiles.push(totalMiles);

        const pace =
            run.Pace || run.pace || "0:00";

        const paceParts =
            pace.split(":");

        let paceValue = 0;

        if(paceParts.length === 2){

            paceValue =
                Number(paceParts[0]) +
                Number(paceParts[1]) / 60;
        }

        paces.push(paceValue);

    });

    // Distance

    new Chart(
        document.getElementById("distanceChart"),
        {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Distance (Miles)",
                    data: distances,
                    backgroundColor: "#fc5200"
                }]
            }
        }
    );

    // Pace

    new Chart(
        document.getElementById("paceChart"),
        {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Pace (Minutes Per Mile)",
                    data: paces,
                    borderColor: "#4caf50",
                    tension: 0.3
                }]
            }
        }
    );

    // Total Mileage

    new Chart(
        document.getElementById("mileageChart"),
        {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Cumulative Miles",
                    data: cumulativeMiles,
                    borderColor: "#2196f3",
                    tension: 0.3
                }]
            }
        }
    );

})
.catch(error => {

    console.error(error);

});
</script>

</body>
</html>
