<!DOCTYPE html>
<html>

<head>
    <title>Run history</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<div class="navbar">
    <a href="logrun.html">Log Run</a>
    <a href="history.html">History</a>
    <a href="shoe.html">Shoes</a>
    <a href="graph.html">Analytics</a>
</div>
    
<h1>📖 Run History</h1>

<table id="historyTable">

<thead>
<tr>
    <th>Date</th>
    <th>Distance</th>
    <th>Time</th>
    <th>Pace</th>
    <th>Shoe</th>
    <th>Type</th>
    <th>Weight</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby_lVG_c0re8dsFtHyY3gPE1Sw9wxQ4905V7Sc3q-sGE8iDs5KJfm3qUZuvFZiEeS3B/exec";

const tbody =
document.querySelector("#historyTable tbody");

tbody.innerHTML = `
<tr>
<td colspan="7" style="text-align:center;">
Loading runs...
</td>
</tr>
`;

fetch(API_URL)
.then(response => response.json())
.then(data => {

    tbody.innerHTML = "";

    data.reverse();

    data.forEach(run => {

        const row =
        document.createElement("tr");

        row.innerHTML = `
            <td>${run.Date || run.date || ""}</td>
            <td>${run.Distance || run.distance || ""}</td>
            <td>${run.Time || run.time || ""}</td>
            <td>${run.Pace || run.pace || ""}</td>
            <td>${run.Shoe || run.shoe || ""}</td>
            <td>${run.Type || run.type || ""}</td>
            <td>${run.Weight || run.weight || ""}</td>
        `;

        tbody.appendChild(row);

    });

});

</script>

</body>
</html>
