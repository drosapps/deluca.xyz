<!DOCTYPE html>
<html>
<head>
    <title>Log Run</title>
</head>
<body>

<h1>Log a Run</h1>

<form id="runForm">

<label>Date</label><br>
<input type="date" id="date"><br><br>

<label>Distance (miles)</label><br>
<input type="number" step="0.01" id="distance"><br><br>

<label>Time (minutes)</label><br>
<input type="number" step="0.01" id="time"><br><br>

<label>Shoe</label><br>
<input type="text" id="shoe"><br><br>

<label>Run Type</label><br>
<select id="type">
  <option>Easy</option>
  <option>Long Run</option>
  <option>Tempo</option>
  <option>Intervals</option>
  <option>Race</option>
</select><br><br>

<label>Weight</label><br>
<input type="number" step="0.1" id="weight"><br><br>

<label>Effort (1-10)</label><br>
<input type="number" min="1" max="10" id="effort"><br><br>

<label>Notes</label><br>
<textarea id="notes"></textarea><br><br>

<button type="submit">Save Run</button>

</form>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbwdxp6vNV7ZhvNGbGkLjV5FtWJFX76dYWwDN_nj2jjuXLOr3JXwAaE_UnvjXsHZF1yg/exec";
document
.getElementById("runForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const distance =
parseFloat(
document.getElementById("distance").value
);

const time =
parseFloat(
document.getElementById("time").value
);

const pace = (time / distance).toFixed(2);

const payload = {
 date:
 document.getElementById("date").value,

 distance,
 time,

 pace,

 shoe:
 document.getElementById("shoe").value,

 type:
 document.getElementById("type").value,

 weight:
 document.getElementById("weight").value,

 effort:
 document.getElementById("effort").value,

 notes:
 document.getElementById("notes").value
};

await fetch(scriptURL,{
 method:"POST",
 body:JSON.stringify(payload)
});

alert("Run Saved!");

});

</script>

</body>
</html>
