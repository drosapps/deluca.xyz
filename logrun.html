<!DOCTYPE html>
<html>
<head>
<title>Anthony's Running Log</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #121212;
    color: white;
    font-family: "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: #1e1e1e;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
    color: #fc5200;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaaaaa;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #2b2b2b;
    color: white;
    margin-bottom: 18px;
    font-size: 15px;
}

input:focus,
select:focus,
textarea:focus {
    outline: 2px solid #fc5200;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    background: #fc5200;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #ff6e2b;
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 30px;
}

.stat-card {
    flex: 1;
    background: #2b2b2b;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.stat-value {
    font-size: 22px;
    font-weight: bold;
    color: #fc5200;
}

.stat-label {
    font-size: 12px;
    color: #aaa;
}
</style>

</head>

<body>

<div class="container">

<h1>🏃 Anthony's Running Log</h1>

<p class="subtitle">
Track mileage, shoes, weight, and PRs
</p>

<div class="stats">
    <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Runs</div>
    </div>

    <div class="stat-card">
        <div class="stat-value">0.0</div>
        <div class="stat-label">Miles</div>
    </div>

    <div class="stat-card">
        <div class="stat-value">--</div>
        <div class="stat-label">Weight</div>
    </div>
</div>

<form id="runForm">

<label>Date</label><br>
<input type="date" id="date"><br><br>

<label>Distance (miles)</label><br>
<input type="number" step="0.01" id="distance"><br><br>

<label>Time</label><br>
<input
  type="text"
  id="time"
  placeholder="MM:SS"
><br><br>
    
<label>Shoe</label><br>
<select id="shoe">
  <option value="Evo SL">Evo SL</option>
  <option value="Glycerin 22">Glycerin 22</option>
  <option value="Revolution 8">Revolution 8</option>
</select><br><br>

<label>Run Type</label><br>
<select id="type">
  <option>Easy</option>
  <option>Long Run</option>
  <option>Tempo</option>
  <option>Intervals</option>
  <option>Race</option>
</select><br><br>

<label>Weight</label><br>
<input type="number" step="0.1" id="weight"><br><br>

<label>Effort (1-10)</label><br>
<input type="number" min="1" max="10" id="effort"><br><br>

<label>Notes</label><br>
<textarea id="notes"></textarea><br><br>

<button type="submit">Save Run</button>

</form>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbwdxp6vNV7ZhvNGbGkLjV5FtWJFX76dYWwDN_nj2jjuXLOr3JXwAaE_UnvjXsHZF1yg/exec";
document
.getElementById("runForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const distance =
parseFloat(
document.getElementById("distance").value
);

const timeString =
document.getElementById("time").value;

const parts = timeString.trim().split(":");

if(parts.length !== 2){
    alert("Please use MM:SS format");
    return;
}

const minutes = Number(parts[0]);
const seconds = Number(parts[1]);

if(
    isNaN(minutes) ||
    isNaN(seconds) ||
    seconds < 0 ||
    seconds > 59
){
    alert("Invalid time format. Use MM:SS");
    return;
}

const totalSeconds = minutes * 60 + seconds;

const paceSeconds = totalSeconds / distance;

const paceMinutes =
Math.floor(paceSeconds / 60);

const paceRemainder =
Math.floor(paceSeconds % 60);

const pace =
`${paceMinutes}:${String(
paceRemainder
).padStart(2,"0")}`;

const payload = {
  date: document.getElementById("date").value,
  distance,
  time: timeString,
  pace,

  shoe: document.getElementById("shoe").value,

  type: document.getElementById("type").value,

  weight: document.getElementById("weight").value,

  effort: document.getElementById("effort").value,

  notes: document.getElementById("notes").value
};

await fetch(scriptURL,{
 method:"POST",
 body:JSON.stringify(payload)
});

alert("Run Saved!");

});

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

</script>

</body>
</div>
</html>
