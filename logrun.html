<!DOCTYPE html>
<html>
<head>
    <title>Anthony's Running Log</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

<div class="navbar">
    <a href="logrun.html">Log Run</a>
    <a href="history.html">History</a>
    <a href="shoe.html">Shoes</a>
    <a href="graph.html">Analytics</a>
</div>

<h1>🏃 Anthony's Running Log</h1>
    
<p class="subtitle">
Track mileage, shoes, weight, and PRs
</p>

<div class="stats">

    <div class="stat-card">
        <div class="stat-value" id="runCount">0</div>
        <div class="stat-label">Runs</div>
    </div>

    <div class="stat-card">
        <div class="stat-value" id="mileCount">0.0</div>
        <div class="stat-label">Miles</div>
    </div>

    <div class="stat-card">
        <div class="stat-value" id="currentWeight">--</div>
        <div class="stat-label">Weight</div>
    </div>

</div>

<form id="runForm">

<label>Date</label><br>
<input type="date" id="date"><br><br>
    
<label>Distance (miles)</label><br>
<input type="number" step="0.01" id="distance"><br><br>

<label>Time</label><br>
<input
  type="text"
  id="time"
  placeholder="MM:SS"
><br><br>
    
<label>Shoe</label><br>
<select id="shoe">
  <option value="Evo SL">Evo SL</option>
  <option value="Glycerin 22">Glycerin 22</option>
  <option value="Revolution 8">Revolution 8</option>
</select><br><br>

<label>Run Type</label><br>
<select id="type">
  <option>Easy</option>
  <option>Long Run</option>
  <option>Tempo</option>
  <option>Intervals</option>
  <option>Race</option>
</select><br><br>

<label>Weight</label><br>
<input type="number" step="0.1" id="weight"><br><br>

<label>Effort (1-10)</label><br>
<input type="number" min="1" max="10" id="effort"><br><br>

<label>Notes</label><br>
<textarea id="notes"></textarea><br><br>

<button type="submit">Save Run</button>

</form>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycby_lVG_c0re8dsFtHyY3gPE1Sw9wxQ4905V7Sc3q-sGE8iDs5KJfm3qUZuvFZiEeS3B/exec";
document
.getElementById("runForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const timeInput = document.getElementById("time");

timeInput.addEventListener("input", function() {

    let value = this.value.replace(/\D/g, "");

    if (value.length > 4) {
        value = value.substring(0, 4);
    }

    if (value.length === 4) {
        value =
            value.substring(0, 2)
            + ":"
            + value.substring(2);
    }

    this.value = value;

});

const distance =
parseFloat(
document.getElementById("distance").value
);

const timeString =
document.getElementById("time").value;

const parts = timeString.trim().split(":");

if(parts.length !== 2){
    alert("Please use MM:SS format");
    return;
}

const minutes = Number(parts[0]);
const seconds = Number(parts[1]);

if(
    isNaN(minutes) ||
    isNaN(seconds) ||
    seconds < 0 ||
    seconds > 59
){
    alert("Invalid time format. Use MM:SS");
    return;
}

const totalSeconds = minutes * 60 + seconds;

const paceSeconds = totalSeconds / distance;

const paceMinutes =
Math.floor(paceSeconds / 60);

const paceRemainder =
Math.floor(paceSeconds % 60);

const pace =
`${paceMinutes}:${String(
paceRemainder
).padStart(2,"0")}`;

const payload = {
  date: document.getElementById("date").value,
  distance,
  time: timeString,
  pace,

  shoe: document.getElementById("shoe").value,

  type: document.getElementById("type").value,

  weight: document.getElementById("weight").value,

  effort: document.getElementById("effort").value,

  notes: document.getElementById("notes").value
};

await fetch(scriptURL,{
 method:"POST",
 body:JSON.stringify(payload)
});

alert("Run Saved!");

});

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

fetch(scriptURL)
.then(response => response.json())
.then(data => {

    document.getElementById("runCount").textContent =
      data.length;

    let totalMiles = 0;

    data.forEach(run => {
        totalMiles += Number(run.Distance || run.distance || 0);
    });

    document.getElementById("mileCount").textContent =
      totalMiles.toFixed(1);

    const lastRun = data[data.length - 1];

    document.getElementById("currentWeight").textContent =
      lastRun.Weight ||
      lastRun.weight ||
      "--";

})
.catch(error => {
    console.error(error);
});

</script>

</body>
</div>
</html>
